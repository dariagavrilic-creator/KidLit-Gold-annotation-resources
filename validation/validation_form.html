<title>KidLit — внешняя проверка решений</title>
<style>
  :root{
    --ink:#1a1d21; --ink-soft:#5b6470; --line:#dfe3e8; --bg:#f7f8f9;
    --card:#ffffff; --ok:#1f6f43; --ok-bg:#e7f3ec; --no:#8f2f2f; --no-bg:#fbeceb;
    --mark:#fff2b8; --accent:#2c4a7c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       font-size:16px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 96px}
  header{display:flex;justify-content:space-between;align-items:baseline;
         gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
  .counter{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:14px}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:26px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
  .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
           color:var(--ink-soft);margin-bottom:14px}
  .q{font-size:15px;color:var(--ink-soft);margin:0 0 14px}
  .ctx{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.65;
       background:#fcfcfa;border-left:3px solid var(--line);padding:14px 18px;
       border-radius:0 6px 6px 0;margin-bottom:20px}
  .ctx mark{background:var(--mark);padding:1px 2px;border-radius:2px}
  .versions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .v{flex:1 1 220px;border:1px solid var(--line);border-radius:8px;padding:10px 13px;
     background:#fbfcfd;font-size:15px}
  .v b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
       color:var(--ink-soft);font-weight:600;margin-bottom:3px}
  .decision{border:1.5px solid var(--accent);border-radius:8px;padding:13px 16px;
            background:#f3f6fb;margin-bottom:22px}
  .decision b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
              color:var(--accent);font-weight:700;margin-bottom:4px}
  .decision span{font-size:17px;font-weight:600}
  .ask{font-size:15px;font-weight:600;margin-bottom:12px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-weight:600;border-radius:8px;border:1.5px solid var(--line);
         background:#fff;color:var(--ink);padding:12px 18px;cursor:pointer;
         display:inline-flex;align-items:center;gap:9px}
  button:hover{border-color:var(--ink-soft)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .yes{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
  .no{border-color:var(--no);color:var(--no);background:var(--no-bg)}
  kbd{font:600 11px/1 ui-monospace,Menlo,Consolas,monospace;border:1px solid currentColor;
      border-radius:3px;padding:3px 5px;opacity:.65}
  .note{width:100%;margin-top:14px;padding:10px 12px;border:1px solid var(--line);
        border-radius:8px;font:inherit;font-size:14px;resize:vertical;min-height:44px}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
  .ghost{background:none;border:none;color:var(--ink-soft);font-weight:500;padding:8px 0}
  .ghost:hover{color:var(--ink);text-decoration:underline}
  .done{text-align:center;padding:40px 20px}
  .done h2{font-size:22px;margin:0 0 10px}
  .big{background:var(--accent);color:#fff;border-color:var(--accent);
       padding:14px 26px;font-size:16px;margin-top:18px}
  .hint{color:var(--ink-soft);font-size:13px;margin-top:22px;text-align:center}
  .saved{color:var(--ok);font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

ать ли сущность", "question": "Нужно ли размечать это слово как сущность?", "context": "А под тёмной, под водой Ходит окунь с бородой. <mark>Хочет месяц проглотить, Да не может ухватить.</mark> Уж я окуню велю Наготовить киселю, Малых деток угощать, Бородою не стращать.", "v1": "Разметить «месяц» как PER_ROLE", "v2": "Не размечать (это не сущность)", "decision": "Разметить «месяц» как PER_ROLE"}, {"n": 144, "case_id": "C0849", "type_ru": "Категория сущности", "question": "К какой категории относится выделенное слово?", "context": "— Тогда стань маленьким! <mark>Красный послушался.</mark> Жёлтый укутал его и позвал Синего.", "v1": "«Красный» → PER_NAME", "v2": "«Красный» → PER_ROLE", "decision": "Разметить «Красный» как PER_NAME"}, {"n": 145, "case_id": "C0489", "type_ru": "Тональность предложения", "question": "Какую метку тональности должно получить выделенное предложение?", "context": "Кто там? спросил. <mark>И мгновенно проснулся.</mark> Запах опилок и свежего хлеба.", "v1": "+1 (позитив)", "v2": "0 (нейтрально)", "decision": "0 (нейтрально)"}, {"n": 146, "case_id": "C0454", "type_ru": "Размечать ли сущность", "question": "Нужно ли размечать это слово как сущность?", "context": "Факир. <mark>Древний фокусник-факир Повидал за жизнь весь мир.</mark> Без ракет больших стальных На планетах был иных.", "v1": "Разметить «факир» как PER_ROLE", "v2": "Не размечать (это не сущность)", "decision": "Разметить «факир» как PER_ROLE"}, {"n": 147, "case_id": "C1117", "type_ru": "Тональность предложения", "question": "Какую метку тональности должно получить выделенное предложение?", "context": "— Что значит — «для чего»? <mark>Чтобы превратиться в бабочку, конечно!</mark> — В бабочку, правда?", "v1": "−1 (негатив)", "v2": "0 (нейтрально)", "decision": "+1 (позитив)"}, {"n": 148, "case_id": "C0713", "type_ru": "Тональность предложения", "question": "Какую метку тональности должно получить выделенное предложение?", "context": "Шарк. <mark>Мы идём издалека.</mark> Мы измучены слегка.", "v1": "−1 (негатив)", "v2": "0 (нейтрально)", "decision": "−1 (негатив)"}, {"n": 149, "case_id": "C1354", "type_ru": "Размечать ли сущность", "question": "Нужно ли размечать это слово как сущность?", "context": "СМОТРИ, ВОТ ТАК… <mark>Вим щёлкает зубами.</mark> Клац, клац, клац!", "v1": "Не размечать (это не сущность)", "v2": "Разметить «Вим» как PER_NAME", "decision": "Разметить «Вим» как PER_NAME"}, {"n": 150, "case_id": "C0739", "type_ru": "Тональность предложения", "question": "Какую метку тональности должно получить выделенное предложение?", "context": "Мышка побежала дальше и увидела кого-то на дереве. <mark>У него была красивая красная грудка и чёрная шапочка.</mark> — Это, случайно, не вы Новый год? — спросила мышка.", "v1": "0 (нейтрально)", "v2": "+1 (позитив)", "decision": "+1 (позитив)"}];
let i = 0, answers = {};
try { answers = JSON.parse(localStorage.getItem('kidlit_val') || '{}'); } catch(e) { answers = {}; }
function save(){ try { localStorage.setItem('kidlit_val', JSON.stringify(answers)); } catch(e){} }
const app = document.getElementById('app');
document.getElementById('total').textContent = CASES.length;

function render(){
  if (i >= CASES.length) return finish();
  const c = CASES[i], a = answers[c.case_id] || {};
  document.getElementById('pos').textContent = i+1;
  document.getElementById('answered').textContent = Object.keys(answers).length;
  document.getElementById('prog').style.width = (Object.keys(answers).length/CASES.length*100)+'%';
  app.innerHTML = `
    <div class="card">
      <div class="eyebrow">${c.type_ru} · случай ${c.case_id}</div>
      <p class="q">${c.question}</p>
      <div class="ctx">${c.context}</div>
      <div class="versions">
        <div class="v"><b>Вариант 1</b>${c.v1}</div>
        <div class="v"><b>Вариант 2</b>${c.v2}</div>
      </div>
      <div class="decision"><b>Принятое решение</b><span>${c.decision}</span></div>
      <p class="ask">Согласны ли вы с принятым решением?</p>
      <div class="btns">
        <button class="yes" data-v="correct">Верно <kbd>1</kbd></button>
        <button class="no"  data-v="incorrect">Неверно <kbd>2</kbd></button>
        <button          data-v="unclear">Затрудняюсь <kbd>0</kbd></button>
      </div>
      <textarea class="note" id="note" placeholder="Комментарий (по желанию) — особенно полезен, если вы выбрали «Неверно»">${a.note||''}</textarea>
      <div class="nav">
        <button class="ghost" id="back" ${i===0?'disabled':''}>← Назад</button>
        <span class="saved">${a.verdict? 'Ответ записан: '+({correct:'верно',incorrect:'неверно',unclear:'затрудняюсь'})[a.verdict] : ''}</span>
      </div>
    </div>`;
  app.querySelectorAll('button[data-v]').forEach(b =>
    b.onclick = () => answer(b.dataset.v));
  const back = document.getElementById('back');
  if (back) back.onclick = () => { if(i>0){ i--; render(); } };
}
function answer(v){
  const c = CASES[i];
  answers[c.case_id] = { verdict: v, note: document.getElementById('note').value.trim() };
  save(); i++; render();
}
function finish(){
  const n = Object.keys(answers).length;
  document.getElementById('pos').textContent = CASES.length;
  document.getElementById('answered').textContent = n;
  document.getElementById('prog').style.width = (n/CASES.length*100)+'%';
  app.innerHTML = `<div class="card done">
      <h2>Готово: ${n} из ${CASES.length}</h2>
      <p>Нажмите кнопку ниже и пришлите скачанный файл.</p>
      <button class="big" id="dl">Скачать результаты (CSV)</button>
      <div class="nav"><button class="ghost" id="rev">← Вернуться к последнему случаю</button></div>
    </div>`;
  document.getElementById('dl').onclick = download;
  document.getElementById('rev').onclick = () => { i = CASES.length-1; render(); };
}
function download(){
  let csv = 'case_id,verdict,note\n';
  CASES.forEach(c => {
    const a = answers[c.case_id];
    if (!a) return;
    csv += `${c.case_id},${a.verdict},"${(a.note||'').replace(/"/g,'""')}"\n`;
  });
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'validation_results.csv'; a.click();
  URL.revokeObjectURL(url);
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA') return;
  if (e.key === '1') answer('correct');
  else if (e.key === '2') answer('incorrect');
  else if (e.key === '0') answer('unclear');
  else if (e.key === 'ArrowLeft' && i > 0) { i--; render(); }
});
// resume where the expert left off
const firstUnanswered = CASES.findIndex(c => !answers[c.case_id]);
i = firstUnanswered === -1 ? CASES.length : firstUnanswered;
render();
</script>
